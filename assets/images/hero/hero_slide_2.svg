  <!-- Autonomous Drone Path Lines -->
  <path d="M -100 700 Q 400 200 900 500 T 1700 200" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="4" stroke-dasharray="12 12" />
  <path d="M -100 750 Q 400 250 900 550 T 1700 250" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="2" />
