<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#hero1Grad)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <!-- Horizon Line & Glow -->
  <line x1="0" y1="550" x2="1600" y2="550" stroke="url(#glow)" stroke-width="3" />
  <!-- Abstract Wings / Jet Silhouette -->
  <g transform="translate(800, 420) scale(2)" opacity="0.15">
    <path d="M0 -100 L40 60 L10 50 L0 70 L-10 50 L-40 60 Z" fill="#FFFFFF" />
  </g>
  <!-- Futuristic HUD Rings -->
  <circle cx="800" cy="450" r="280" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="2" stroke-dasharray="10 15" />
  <circle cx="800" cy="450" r="180" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1" />
</svg>
